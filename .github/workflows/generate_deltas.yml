name: Generate Differential Deltas & Sync Catalog

on:
  workflow_dispatch:
    inputs:
      deltas_repo:
        description: 'Repositorio satélite de GitHub para almacenar los deltas'
        required: false
        default: 'HakkinDavid/hakkin-launcher-deltas'
      dry_run:
        description: 'Simular generación sin publicar en GitHub'
        type: boolean
        required: false
        default: false

concurrency:
  group: deltas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-and-sync-deltas:
    name: Generate Deltas & Update Catalog
    runs-on: ubuntu-latest
    env:
      HAKKIN_PKG_CACHE_DIR: ${{ github.workspace }}/.cache/hakkin_pkg_cache

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HDiffPatch Binaries
        id: cache-hdiffpatch
        uses: actions/cache@v4
        with:
          path: tools/bin
          key: hdiffpatch-v5.1.3-${{ runner.os }}

      - name: Install HDiffPatch Binaries (hdiffz & hpatchz)
        if: steps.cache-hdiffpatch.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/bin /tmp/hdiff_extract
          echo "⬇️ Descargando HDiffPatch v5.1.3 para Linux x64..."
          curl -fsSL -o /tmp/hdiffpatch.zip "https://github.com/sisong/HDiffPatch/releases/download/v5.1.3/hdiffpatch_v5.1.3_bin_linux64.zip"
          unzip -q -o /tmp/hdiffpatch.zip -d /tmp/hdiff_extract
          find /tmp/hdiff_extract -name "hdiffz" -type f -exec cp {} tools/bin/ \;
          find /tmp/hdiff_extract -name "hpatchz" -type f -exec cp {} tools/bin/ \;
          chmod +x tools/bin/hdiffz tools/bin/hpatchz

      - name: Configure and Verify HDiffPatch
        run: |
          chmod +x tools/bin/hdiffz tools/bin/hpatchz
          echo "$(pwd)/tools/bin" >> $GITHUB_PATH
          echo "✅ HDiffPatch configurado y verificado:"
          tools/bin/hdiffz -v

      - name: Cache Application Packages for Deltas
        uses: actions/cache@v4
        with:
          path: .cache/hakkin_pkg_cache
          key: deltas-pkg-${{ runner.os }}-${{ hashFiles('tools/catalog_overrides.json', 'docs/catalog.json') }}-${{ github.run_id }}
          restore-keys: |
            deltas-pkg-${{ runner.os }}-${{ hashFiles('tools/catalog_overrides.json', 'docs/catalog.json') }}-
            deltas-pkg-${{ runner.os }}-

      - name: Run Unit Tests for Delta and Catalog Generators
        run: |
          python3 tools/test_delta_generator.py
          python3 tools/test_catalog_generator.py

      - name: Generate Deltas & Synchronize Catalog
        env:
          GITHUB_TOKEN: ${{ secrets.DELTAS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_ARGS=()
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS+=("--dry-run-deltas")
          fi

          DELTAS_TARGET="${{ github.event.inputs.deltas_repo }}"
          if [ -z "$DELTAS_TARGET" ]; then
            DELTAS_TARGET="HakkinDavid/hakkin-launcher-deltas"
          fi

          echo "🚀 Ejecutando generador centralizado de deltas..."
          echo "   Repositorio Satélite: $DELTAS_TARGET"
          echo "   Directorio de Caché: $HAKKIN_PKG_CACHE_DIR"
          
          python3 tools/catalog_generator.py \
            --generate-deltas \
            --deltas-repo "$DELTAS_TARGET" \
            --update-example \
            --pkg-cache-dir "$HAKKIN_PKG_CACHE_DIR" \
            "${EXTRA_ARGS[@]}"

      - name: Commit and Push Updated Catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/launcher_meta.json docs/catalog.json docs/catalog_example.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalog): sincronizar parches diferenciales y launcher_meta [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Catálogo actualizado y subido al repositorio."
          else
            echo "🟢 No hay cambios pendientes en el catálogo."
          fi
